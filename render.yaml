services:
  - type: web
    name: securedocs-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m scripts.download_model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MIN_SIMILARITY
        value: "0.25"
      - key: MIN_KEYWORD_SIMILARITY
        value: "0.10"
      - key: CORS_ORIGINS
        sync: false
